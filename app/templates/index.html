<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Movie List</h1>
    <ul>
        {% for id, movie in movies.items() %}
        <li>
            <strong>{{ movie.title }}</strong>
            ({{ movie.year }}) - Directed by {{ movie.director }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
