<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies CRUD</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>🎥 Movies CRUD App 🎬</h1>

    <section id="movie-list">
        <h2>📜 Movie List</h2>
        <ul id="movies">
            <!-- Lista de películas generada dinámicamente -->
        </ul>
    </section>

    <section id="movie-form">
        <h2>🆕 Add or Update Movie</h2>
        <form id="form">
            <input type="hidden" id="movie-id" />
            <label for="title">Title:</label>
            <input type="text" id="title" required />
            <label for="director">Director:</label>
            <input type="text" id="director" required />
            <label for="year">Year:</label>
            <input type="number" id="year" required />
            <button type="submit">Save Movie</button>
        </form>
    </section>

    <script>
        const moviesList = document.getElementById("movies");
        const form = document.getElementById("form");
        const movieIdInput = document.getElementById("movie-id");
        const titleInput = document.getElementById("title");
        const directorInput = document.getElementById("director");
        const yearInput = document.getElementById("year");

        // Cargar lista inicial de películas
        async function loadMovies() {
            const response = await fetch("/api/movies");
            const movies = await response.json();
            renderMovies(movies);
        }

        // Renderizar lista de películas
        function renderMovies(movies) {
            moviesList.innerHTML = "";
            Object.entries(movies).forEach(([id, movie]) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <strong>${movie.title}</strong> (${movie.year}) - Directed by ${movie.director}
                    <button onclick="editMovie(${id})">Edit</button>
                    <button onclick="deleteMovie(${id})">Delete</button>
                `;
                moviesList.appendChild(li);
            });
        }

        // Crear o actualizar película
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = movieIdInput.value;
            const data = {
                title: titleInput.value,
                director: directorInput.value,
                year: yearInput.value,
            };

            if (id) {
                // Actualizar película
                await fetch(`/api/movies/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });
            } else {
                // Crear película
                await fetch("/api/movies", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });
            }

            form.reset();
            movieIdInput.value = "";
            await loadMovies();
        });

        // Editar película
        async function editMovie(id) {
            const response = await fetch(`/api/movies`);
            const movies = await response.json();
            const movie = movies[id];

            movieIdInput.value = id;
            titleInput.value = movie.title;
            directorInput.value = movie.director;
            yearInput.value = movie.year;
        }

        // Eliminar película
        async function deleteMovie(id) {
            await fetch(`/api/movies/${id}`, { method: "DELETE" });
            await loadMovies();
        }

        // Inicializar la aplicación
        loadMovies();
    </script>
</body>
</html>
